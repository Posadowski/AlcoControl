name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  firmware-build:
    name: Build firmware (checks the partition size)
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

  unit-tests:
    name: Unit tests (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: QEMU dependencies & pytest
        shell: bash
        run: |
          apt-get update
          apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          . $IDF_PATH/export.sh
          python $IDF_PATH/tools/idf_tools.py install qemu-xtensa
          pip install pytest-embedded pytest-embedded-idf pytest-embedded-qemu

      - name: Build & Run tests
        shell: bash
        working-directory: test_apps/unit
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32
          idf.py build
          pytest pytest_unit.py --target esp32 --embedded-services idf,qemu --junitxml=results.xml

      - name: Tests Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test_apps/unit/results.xml
      - name: Test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          path = "test_apps/unit/results.xml"
          if not os.path.exists(path):
              print("### Unit tests: no results.xml (the build or the run failed earlier)")
              raise SystemExit

          cases = list(ET.parse(path).getroot().iter("testcase"))
          bad = [c for c in cases if any(ch.tag in ("failure", "error") for ch in c)]
          skipped = [c for c in cases if any(ch.tag == "skipped" for ch in c)]
          passed = len(cases) - len(bad) - len(skipped)
          print(f"### Unit tests (QEMU): {passed} passed, {len(bad)} failed, {len(skipped)} skipped")

          if bad:
              print("")
              print("| Test | Message |")
              print("|---|---|")
              for c in bad:
                  msg = ""
                  for ch in c:
                      if ch.tag in ("failure", "error"):
                          lines = (ch.attrib.get("message") or ch.text or "").strip().splitlines()
                          msg = lines[0] if lines else ""
                  print(f"| {c.attrib.get('name')} | {msg.replace('|', '/')} |")
          EOF    