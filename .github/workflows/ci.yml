name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  firmware-build:
    name: Build firmware (checks the partition size)
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

  unit-tests:
    name: Unit tests (QEMU)
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4

      - name: QEMU dependencies & pytest
        shell: bash
        run: |
          apt-get update
          apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          . $IDF_PATH/export.sh
          python $IDF_PATH/tools/idf_tools.py install qemu-xtensa
          pip install pytest-embedded pytest-embedded-idf pytest-embedded-qemu

      - name: Build & Run tests
        shell: bash
        working-directory: test_apps/unit
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32
          idf.py build
          pytest pytest_unit.py --target esp32 --embedded-services idf,qemu --junitxml=results.xml

      - name: Tests Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test_apps/unit/results.xml